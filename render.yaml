# Render Blueprint untuk backend (Express + Prisma). Dibaca saat membuat "New > Blueprint" di Render.
# Frontend tidak di sini: frontend di-deploy Vercel (Root Directory: frontend).
services:
  - type: web
    name: tonnage-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    # --include=dev: TypeScript & Prisma CLI ada di devDependencies, dibutuhkan untuk build & migrasi.
    buildCommand: npm ci --include=dev && npm run build
    # Migrasi dijalankan tiap start (aman diulang: hanya menerapkan migrasi yang belum ada).
    # Paket berbayar bisa memindahkannya ke preDeployCommand.
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/health
    # Deploy hanya kalau CI GitHub (ci.yml) lolos untuk commit itu.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      # sync: false = Render meminta Anda mengisi nilainya saat Blueprint dibuat (tidak disimpan di repo).
      # Supabase "Session pooler" (port 5432): satu URL untuk aplikasi sekaligus migrasi.
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
